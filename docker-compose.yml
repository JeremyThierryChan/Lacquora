version: '3.9'

services:

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lacquora-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       lacquora
      POSTGRES_USER:     lacquora_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lacquora_dev_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lacquora_user -d lacquora']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ───────────────────────────────────────────────
  lacquora-server:
    build:
      context: ./lacquora-server
      target: production
    container_name: lacquora-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:     production
      PORT:         3001
      DB_HOST:      postgres
      DB_PORT:      5432
      DB_NAME:      lacquora
      DB_USER:      lacquora_user
      DB_PASSWORD:  ${DB_PASSWORD:-lacquora_dev_pass}
      JWT_SECRET:   ${JWT_SECRET:-change_this_in_production}
      JWT_EXPIRES_IN: 7d
      SMTP_HOST:    ${SMTP_HOST:-}
      SMTP_PORT:    ${SMTP_PORT:-587}
      SMTP_USER:    ${SMTP_USER:-}
      SMTP_PASS:    ${SMTP_PASS:-}
      EMAIL_FROM:   ${EMAIL_FROM:-LACQUORA Studio <studio@lacquora.com>}
      EMAIL_ADMIN:  ${EMAIL_ADMIN:-admin@lacquora.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Frontend ──────────────────────────────────────────────────
  lacquora-web:
    build:
      context: ./lacquora-web
      target: production
    container_name: lacquora-frontend
    restart: unless-stopped
    depends_on:
      - lacquora-server
    ports:
      - '80:80'

volumes:
  postgres_data:
  uploads_data:

networks:
  default:
    name: lacquora-network
